<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 验证码管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #1e293b; padding: 40px; border-radius: 12px;
      width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h1 { font-size: 20px; margin-bottom: 24px; text-align: center; color: #94a3b8; }
    input {
      width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 15px;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #0284c7; color: #fff; font-size: 15px; cursor: pointer;
    }
    button:hover { background: #0369a1; }
    .err { color: #f87171; font-size: 13px; margin-bottom: 12px; text-align: center; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>验证码管理后台</h1>
    <div class="err" id="err"></div>
    <input type="password" id="password" placeholder="管理员密码" autocomplete="current-password">
    <button id="btn">登 录</button>
  </div>
  <script>
    document.getElementById('btn').addEventListener('click', login);
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
    async function login() {
      const password = document.getElementById('password').value;
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const j = await r.json();
        if (j.ok) { location.href = '/'; } else { err.textContent = '密码错误'; }
      } catch (e) { err.textContent = '请求失败,请检查服务器'; }
    }
  </script>
</body>
</html>
