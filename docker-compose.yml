services:
  license:
    build: .
    container_name: license-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请先复制 .env.example 为 .env 并设置 ADMIN_PASSWORD}
      - RATE_LIMIT_MAX=30
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data